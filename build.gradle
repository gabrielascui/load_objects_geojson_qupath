plugins {
    id 'java'
}

group = 'qupath.ext'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public/' }
    maven { url 'https://maven.scijava.org/content/repositories/releases/' }
}

dependencies {
    implementation 'io.github.qupath:qupath-gui-fx:0.6.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly 'org.openjfx:javafx-base:21.0.2:linux'
    compileOnly 'org.openjfx:javafx-graphics:21.0.2:linux'
    compileOnly 'org.openjfx:javafx-controls:21.0.2:linux'
    compileOnly 'org.slf4j:slf4j-api:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}
